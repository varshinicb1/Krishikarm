# ============================================================
# Kisan-Eye V6 — Production Deployment
# One command: docker compose up --build
# ============================================================

services:
  # ── Ollama LLM Server (GPU-accelerated) ──
  ollama:
    image: ollama/ollama:latest
    container_name: kisan-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Auto-pull LLaMA 3 model on first run ──
  ollama-init:
    image: curlimages/curl:latest
    container_name: kisan-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '🧠 Pulling llama3 model...' &&
        curl -s http://ollama:11434/api/pull -d '{\"name\": \"llama3\"}' &&
        echo '✅ LLaMA 3 ready!'
      "
    restart: "no"

  # ── Kisan-Eye Backend + Frontend (single port 8000) ──
  kisan-eye:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisan-eye
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data # Persist farmer DB + face embeddings
      - ./backend/models:/app/backend/models # InsightFace model cache
      - insightface_cache:/root/.insightface # Model downloads
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=llama3
      - WHISPER_MODEL=medium
      - FRONTEND_DIR=/app/frontend
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

volumes:
  ollama_data:
  insightface_cache:
